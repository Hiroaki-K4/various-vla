[project]
name = "various-vla"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch==2.4.1",
    "torchvision==0.19.1",
    "torchaudio==2.4.1",
    "accelerate>=0.30.0,<1.0.0",
    "datasets<3.0.0",
    "matplotlib>=3.10.9",
    "opencv-python>=4.13.0.92",
    "peft>=0.10.0,<0.15.0",
    "pillow>=12.2.0",
    "pyarrow>=24.0.0",
    "scikit-learn>=1.8.0",
    "timm>=1.0.27",
    "transformers>=4.40.0,<5.0.0",
    "webdataset>=1.0.2",
    "xformers==0.0.28.post1",
    "optuna>=3.6.0",
    # LIBERO simulation environment
    "robosuite==1.4.1",
    "robomimic==0.3.0",
    "bddl",
    "gym>=0.25,<0.27",
    "cloudpickle",
    "einops",
    "easydict",
    "libero",
    # Plamo dependencies
    "causal-conv1d",
    "mamba-ssm",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.extra-build-dependencies]
mamba-ssm = ["torch"]
causal-conv1d = ["torch"]

[tool.uv.sources]
torch = { url = "https://download.pytorch.org/whl/cu124/torch-2.4.1%2Bcu124-cp312-cp312-linux_x86_64.whl" }
torchvision = { url = "https://download.pytorch.org/whl/cu124/torchvision-0.19.1%2Bcu124-cp312-cp312-linux_x86_64.whl" }
torchaudio = { url = "https://download.pytorch.org/whl/cu124/torchaudio-2.4.1%2Bcu124-cp312-cp312-linux_x86_64.whl" }
mamba-ssm = { url = "https://github.com/state-spaces/mamba/releases/download/v2.2.4/mamba_ssm-2.2.4+cu124torch2.4cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }
causal-conv1d = { url = "https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.4.0/causal_conv1d-1.4.0+cu124torch2.4cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }
libero = { path = "./libero", editable = true }

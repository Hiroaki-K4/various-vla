[project]
name = "various-vla"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers==4.57.1",
    "accelerate>=1.13.0",
    "datasets==2.14.0",
    "matplotlib>=3.10.0",
    "opencv-python>=4.13.0.92",
    "peft>=0.19.1",
    "pillow==12.1.1",
    "pyarrow>=14.0.0,<15.0.0",
    "numpy<2",
    "scikit-learn>=1.8.0",
    "timm>=1.0.27",
    "webdataset>=1.0.2",
    "optuna>=3.6.0",
    "mamba-ssm==2.3.0",
    "causal-conv1d==1.6.0",
    "numba==0.64.0",
    "ninja>=1.13.0",
    "packaging>=26.2",
    "setuptools>=82.0.1",
    "wheel>=0.45.1",
    # LIBERO simulation environment
    "robosuite==1.4.1",
    "robomimic==0.3.0",
    "bddl",
    "gym>=0.25,<0.27",
    "cloudpickle",
    "einops",
    "easydict",
    "libero",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]
no-build-isolation-package = ["causal-conv1d", "mamba-ssm"]

[tool.uv.sources]
libero = { path = "./libero", editable = true }
